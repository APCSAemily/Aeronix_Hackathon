<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="pcbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2e0d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Component highlight effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Component styles -->
    <style>
      .component { cursor: pointer; transition: all 0.3s ease; }
      .component:hover { filter: url(#glow); opacity: 0.8; }
      .component.selected { filter: url(#glow); stroke: #ff0000; stroke-width: 3; }
      .mounting-hole { fill: #1a3309; stroke: #ffd700; stroke-width: 2; }
      .trace { stroke: url(#goldGradient); stroke-width: 2; fill: none; }
      .pad { fill: url(#goldGradient); stroke: #ff8000; stroke-width: 1; }
      .silkscreen { fill: white; font-family: Arial, sans-serif; font-size: 12px; }
      .annotation { fill: #ff0000; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" fill="#1a4d1a" font-size="28" font-family="Arial" font-weight="bold">Interactive Circuit Board Analysis</text>
  
  <!-- PCB Main Board -->
  <rect x="100" y="100" width="800" height="500" fill="url(#pcbGradient)" stroke="#0d2e0d" stroke-width="4" rx="20"/>
  
  <!-- Mounting Holes -->
  <g id="mounting-holes">
    <circle cx="150" cy="150" r="25" class="mounting-hole" data-component="mounting-hole" data-info="FTM1 - Top Left Mounting Hole"/>
    <circle cx="850" cy="150" r="25" class="mounting-hole" data-component="mounting-hole" data-info="Top Right Mounting Hole"/>
    <circle cx="150" cy="550" r="25" class="mounting-hole" data-component="mounting-hole" data-info="HOLE - Bottom Left Mounting Hole"/>
    <circle cx="850" cy="550" r="25" class="mounting-hole" data-component="mounting-hole" data-info="Bottom Right Mounting Hole"/>
    
    <!-- Mounting hole labels -->
    <text x="150" y="190" text-anchor="middle" class="silkscreen">FTM1</text>
    <text x="850" y="190" text-anchor="middle" class="silkscreen">C911</text>
    <text x="150" y="590" text-anchor="middle" class="silkscreen">HOLE</text>
    <text x="850" y="590" text-anchor="middle" class="silkscreen">C910</text>
  </g>
  
  <!-- Top Edge Components -->
  <g id="top-edge-components">
    <!-- Top-left connector pads -->
    <rect x="180" y="120" width="40" height="15" class="pad component" data-component="connector" data-info="Top-left connector pads - Test points or connector interface"/>
    <rect x="230" y="120" width="40" height="15" class="pad component" data-component="connector" data-info="Top-left connector pads - Test points or connector interface"/>
    <rect x="280" y="120" width="40" height="15" class="pad component" data-component="connector" data-info="Top-left connector pads - Test points or connector interface"/>
    
    <!-- Vertical pin header (18 pins) -->
    <g id="vertical-header">
      <rect x="400" y="120" width="20" height="180" class="pad component" data-component="pin-header" data-info="18-pin vertical header connector"/>
      <!-- Individual pins -->
      <rect x="405" y="125" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="140" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="155" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="170" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="185" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="200" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="215" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="230" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="245" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="260" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="275" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="290" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="305" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="320" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="335" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="350" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="365" width="10" height="8" fill="#1a3309"/>
      <rect x="405" y="380" width="10" height="8" fill="#1a3309"/>
    </g>
    
    <!-- Top-right edge connector -->
    <g id="edge-connector">
      <rect x="750" y="120" width="20" height="120" class="pad component" data-component="edge-connector" data-info="10-pin edge connector interface"/>
      <!-- Edge connector fingers -->
      <rect x="755" y="125" width="10" height="8" fill="#1a3309"/>
      <rect x="755" y="140" width="10" height="8" fill="#1a3309"/>
      <rect x="755" y="155" width="10" height="8" fill="#1a3309"/>
      <rect x="755" y="170" width="10" height="8" fill="#1a3309"/>
      <rect x="755" y="185" width="10" height="8" fill="#1a3309"/>
      <rect x="755" y="200" width="10" height="8" fill="#1a3309"/>
      <rect x="755" y="215" width="10" height="8" fill="#1a3309"/>
      <rect x="755" y="230" width="10" height="8" fill="#1a3309"/>
      <rect x="755" y="245" width="10" height="8" fill="#1a3309"/>
      <rect x="755" y="260" width="10" height="8" fill="#1a3309"/>
    </g>
  </g>
  
  <!-- Main Central IC (BGA/QFN) -->
  <g id="main-ic">
    <rect x="450" y="250" width="100" height="100" class="pad component" data-component="main-ic" data-info="Main Processor/FPGA - BGA/QFN Package"/>
    <rect x="455" y="255" width="90" height="90" class="pad"/>
    
    <!-- BGA balls -->
    <circle cx="470" cy="270" r="2" fill="#1a3309"/>
    <circle cx="485" cy="270" r="2" fill="#1a3309"/>
    <circle cx="500" cy="270" r="2" fill="#1a3309"/>
    <circle cx="515" cy="270" r="2" fill="#1a3309"/>
    <circle cx="530" cy="270" r="2" fill="#1a3309"/>
    <circle cx="470" cy="285" r="2" fill="#1a3309"/>
    <circle cx="485" cy="285" r="2" fill="#1a3309"/>
    <circle cx="500" cy="285" r="2" fill="#1a3309"/>
    <circle cx="515" cy="285" r="2" fill="#1a3309"/>
    <circle cx="530" cy="285" r="2" fill="#1a3309"/>
    <circle cx="470" cy="300" r="2" fill="#1a3309"/>
    <circle cx="485" cy="300" r="2" fill="#1a3309"/>
    <circle cx="500" cy="300" r="2" fill="#1a3309"/>
    <circle cx="515" cy="300" r="2" fill="#1a3309"/>
    <circle cx="530" cy="300" r="2" fill="#1a3309"/>
    <circle cx="470" cy="315" r="2" fill="#1a3309"/>
    <circle cx="485" cy="315" r="2" fill="#1a3309"/>
    <circle cx="500" cy="315" r="2" fill="#1a3309"/>
    <circle cx="515" cy="315" r="2" fill="#1a3309"/>
    <circle cx="530" cy="315" r="2" fill="#1a3309"/>
    <circle cx="470" cy="330" r="2" fill="#1a3309"/>
    <circle cx="485" cy="330" r="2" fill="#1a3309"/>
    <circle cx="500" cy="330" r="2" fill="#1a3309"/>
    <circle cx="515" cy="330" r="2" fill="#1a3309"/>
    <circle cx="530" cy="330" r="2" fill="#1a3309"/>
    
    <text x="500" y="370" text-anchor="middle" class="silkscreen">U1</text>
  </g>
  
  <!-- Secondary ICs -->
  <g id="secondary-ics">
    <!-- Top-left IC -->
    <rect x="200" y="200" width="80" height="80" class="pad component" data-component="secondary-ic" data-info="Secondary IC - Possibly power management or peripheral controller"/>
    <rect x="205" y="205" width="70" height="70" class="pad"/>
    <text x="240" y="290" text-anchor="middle" class="silkscreen">U2</text>
    
    <!-- Top-right IC -->
    <rect x="720" y="200" width="80" height="80" class="pad component" data-component="secondary-ic" data-info="Secondary IC - Possibly communication or sensor interface"/>
    <rect x="725" y="205" width="70" height="70" class="pad"/>
    <text x="760" y="290" text-anchor="middle" class="silkscreen">U3</text>
  </g>
  
  <!-- Passive Components -->
  <g id="passive-components">
    <!-- Resistors -->
    <rect x="200" y="350" width="30" height="12" class="pad component" data-component="resistor" data-info="R1 - Surface mount resistor"/>
    <rect x="250" y="350" width="30" height="12" class="pad component" data-component="resistor" data-info="R2 - Surface mount resistor"/>
    <rect x="300" y="350" width="30" height="12" class="pad component" data-component="resistor" data-info="R3 - Surface mount resistor"/>
    <rect x="350" y="350" width="30" height="12" class="pad component" data-component="resistor" data-info="R4 - Surface mount resistor"/>
    
    <!-- Capacitors -->
    <rect x="400" y="350" width="30" height="12" class="pad component" data-component="capacitor" data-info="C1 - Surface mount capacitor"/>
    <rect x="450" y="350" width="30" height="12" class="pad component" data-component="capacitor" data-info="C2 - Surface mount capacitor"/>
    <rect x="500" y="350" width="30" height="12" class="pad component" data-component="capacitor" data-info="C3 - Surface mount capacitor"/>
    <rect x="550" y="350" width="30" height="12" class="pad component" data-component="capacitor" data-info="C4 - Surface mount capacitor"/>
    
    <!-- Inductors -->
    <rect x="600" y="350" width="30" height="12" class="pad component" data-component="inductor" data-info="L1 - Surface mount inductor"/>
    <rect x="650" y="350" width="30" height="12" class="pad component" data-component="inductor" data-info="L2 - Surface mount inductor"/>
    <rect x="700" y="350" width="30" height="12" class="pad component" data-component="inductor" data-info="L3 - Surface mount inductor"/>
    
    <!-- Component labels -->
    <text x="215" y="360" text-anchor="middle" class="silkscreen">R1</text>
    <text x="265" y="360" text-anchor="middle" class="silkscreen">R2</text>
    <text x="315" y="360" text-anchor="middle" class="silkscreen">R3</text>
    <text x="365" y="360" text-anchor="middle" class="silkscreen">R4</text>
    <text x="415" y="360" text-anchor="middle" class="silkscreen">C1</text>
    <text x="465" y="360" text-anchor="middle" class="silkscreen">C2</text>
    <text x="515" y="360" text-anchor="middle" class="silkscreen">C3</text>
    <text x="565" y="360" text-anchor="middle" class="silkscreen">C4</text>
    <text x="615" y="360" text-anchor="middle" class="silkscreen">L1</text>
    <text x="665" y="360" text-anchor="middle" class="silkscreen">L2</text>
    <text x="715" y="360" text-anchor="middle" class="silkscreen">L3</text>
  </g>
  
  <!-- Bottom Edge Connector -->
  <g id="bottom-connector">
    <rect x="150" y="450" width="700" height="30" class="pad component" data-component="bottom-connector" data-info="30-pin bottom edge connector - Main I/O interface"/>
    <!-- Individual connector pins -->
    <rect x="155" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="170" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="185" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="200" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="215" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="230" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="245" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="260" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="275" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="290" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="305" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="320" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="335" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="350" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="365" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="380" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="395" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="410" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="425" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="440" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="455" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="470" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="485" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="500" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="515" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="530" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="545" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="560" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="575" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="590" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="605" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="620" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="635" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="650" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="665" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="680" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="695" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="710" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="725" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="740" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="755" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="770" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="785" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="800" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="815" y="455" width="8" height="20" fill="#1a3309"/>
    <rect x="830" y="455" width="8" height="20" fill="#1a3309"/>
  </g>
  
  <!-- Paw Print Logo -->
  <g id="paw-logo" transform="translate(500, 400)">
    <!-- Paw pad -->
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="white" stroke="#ffd700" stroke-width="2" class="component" data-component="logo" data-info="Aeronix Paw Print Logo - Company branding"/>
    <!-- Toe pads -->
    <ellipse cx="-10" cy="-15" rx="5" ry="7" fill="white" stroke="#ffd700" stroke-width="1"/>
    <ellipse cx="0" cy="-17" rx="5" ry="7" fill="white" stroke="#ffd700" stroke-width="1"/>
    <ellipse cx="10" cy="-15" rx="5" ry="7" fill="white" stroke="#ffd700" stroke-width="1"/>
  </g>
  
  <!-- Company Logo -->
  <g id="company-logo" transform="translate(800, 520)">
    <text x="0" y="0" text-anchor="middle" class="silkscreen" font-size="16" font-weight="bold">Aeronix</text>
    <text x="0" y="15" text-anchor="middle" class="silkscreen" font-size="12">13</text>
  </g>
  
  <!-- Traces -->
  <g id="traces">
    <path d="M 280 200 L 450 300" class="trace"/>
    <path d="M 550 300 L 720 200" class="trace"/>
    <path d="M 500 350 L 500 450" class="trace"/>
    <path d="M 200 200 L 280 200" class="trace"/>
    <path d="M 720 200 L 800 200" class="trace"/>
    <path d="M 200 350 L 280 350" class="trace"/>
    <path d="M 400 350 L 450 350" class="trace"/>
    <path d="M 550 350 L 600 350" class="trace"/>
    <path d="M 700 350 L 800 350" class="trace"/>
  </g>
  
  <!-- Component Legend -->
  <g id="legend" transform="translate(50, 620)">
    <rect x="0" y="0" width="300" height="60" fill="white" stroke="#1a4d1a" stroke-width="2" rx="10"/>
    <text x="10" y="20" fill="#1a4d1a" font-size="14" font-family="Arial" font-weight="bold">Component Legend:</text>
    <text x="10" y="35" fill="#1a4d1a" font-size="12" font-family="Arial">🟡 Gold traces & pads  ⚪ White silkscreen  🟢 Green PCB</text>
    <text x="10" y="50" fill="#1a4d1a" font-size="12" font-family="Arial">Click components to highlight and analyze</text>
  </g>
  
  <!-- Analysis Panel Placeholder -->
  <g id="analysis-panel" transform="translate(700, 620)">
    <rect x="0" y="0" width="250" height="60" fill="#e8f4f8" stroke="#1a4d1a" stroke-width="2" rx="10"/>
    <text x="10" y="20" fill="#1a4d1a" font-size="14" font-family="Arial" font-weight="bold">Component Analysis:</text>
    <text x="10" y="35" fill="#1a4d1a" font-size="12" font-family="Arial" id="component-name">Click a component to analyze</text>
    <text x="10" y="50" fill="#1a4d1a" font-size="10" font-family="Arial" id="component-info">Select any component for detailed information</text>
  </g>
</svg>
