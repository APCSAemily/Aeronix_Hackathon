<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Circuit Board Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .board-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .svg-container {
            flex: 2;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }
        
        .analysis-panel {
            flex: 1;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }
        
        .component {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .component:hover {
            filter: drop-shadow(0 0 8px #ffd700);
            opacity: 0.8;
        }
        
        .component.selected {
            filter: drop-shadow(0 0 12px #ff0000);
            stroke: #ff0000;
            stroke-width: 3;
        }
        
        .analysis-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a4d1a;
            margin-bottom: 15px;
        }
        
        .component-info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ffd700;
            margin-bottom: 15px;
        }
        
        .test-procedures {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
        
        .test-procedures h4 {
            margin-top: 0;
            color: #007bff;
        }
        
        .test-procedures ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .test-procedures li {
            margin-bottom: 5px;
        }
        
        .component-type {
            font-weight: bold;
            color: #1a4d1a;
        }
        
        .component-location {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Interactive Circuit Board Analysis</h1>
        <p>Click on any component below to see detailed analysis and test procedures.</p>
        
        <div class="board-container">
            <div class="svg-container">
                <svg width="800" height="600" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="pcbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#1a4d1a;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0d2e0d;stop-opacity:1" />
                        </linearGradient>
                        
                        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ffb000;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    
                    <!-- PCB Main Board -->
                    <rect x="100" y="100" width="800" height="500" fill="url(#pcbGradient)" stroke="#0d2e0d" stroke-width="4" rx="20"/>
                    
                    <!-- Mounting Holes -->
                    <circle cx="150" cy="150" r="25" fill="#1a3309" stroke="#ffd700" stroke-width="2" class="component" 
                            data-component="mounting-hole" data-info="FTM1 - Top Left Mounting Hole" 
                            data-tests="Visual inspection, continuity test, mechanical fit check"/>
                    <circle cx="850" cy="150" r="25" fill="#1a3309" stroke="#ffd700" stroke-width="2" class="component" 
                            data-component="mounting-hole" data-info="Top Right Mounting Hole" 
                            data-tests="Visual inspection, continuity test, mechanical fit check"/>
                    <circle cx="150" cy="550" r="25" fill="#1a3309" stroke="#ffd700" stroke-width="2" class="component" 
                            data-component="mounting-hole" data-info="HOLE - Bottom Left Mounting Hole" 
                            data-tests="Visual inspection, continuity test, mechanical fit check"/>
                    <circle cx="850" cy="550" r="25" fill="#1a3309" stroke="#ffd700" stroke-width="2" class="component" 
                            data-component="mounting-hole" data-info="Bottom Right Mounting Hole" 
                            data-tests="Visual inspection, continuity test, mechanical fit check"/>
                    
                    <!-- Mounting hole labels -->
                    <text x="150" y="190" text-anchor="middle" fill="white" font-size="12" font-family="Arial">FTM1</text>
                    <text x="850" y="190" text-anchor="middle" fill="white" font-size="12" font-family="Arial">C911</text>
                    <text x="150" y="590" text-anchor="middle" fill="white" font-size="12" font-family="Arial">HOLE</text>
                    <text x="850" y="590" text-anchor="middle" fill="white" font-size="12" font-family="Arial">C910</text>
                    
                    <!-- Main Central IC (BGA/QFN) -->
                    <rect x="450" y="250" width="100" height="100" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="2" class="component" 
                          data-component="main-ic" data-info="Main Processor/FPGA - BGA/QFN Package" 
                          data-tests="Power supply test, clock signal verification, I/O functionality test, thermal analysis"/>
                    <rect x="455" y="255" width="90" height="90" fill="url(#goldGradient)"/>
                    
                    <!-- BGA balls -->
                    <circle cx="470" cy="270" r="2" fill="#1a3309"/>
                    <circle cx="485" cy="270" r="2" fill="#1a3309"/>
                    <circle cx="500" cy="270" r="2" fill="#1a3309"/>
                    <circle cx="515" cy="270" r="2" fill="#1a3309"/>
                    <circle cx="530" cy="270" r="2" fill="#1a3309"/>
                    <circle cx="470" cy="285" r="2" fill="#1a3309"/>
                    <circle cx="485" cy="285" r="2" fill="#1a3309"/>
                    <circle cx="500" cy="285" r="2" fill="#1a3309"/>
                    <circle cx="515" cy="285" r="2" fill="#1a3309"/>
                    <circle cx="530" cy="285" r="2" fill="#1a3309"/>
                    <circle cx="470" cy="300" r="2" fill="#1a3309"/>
                    <circle cx="485" cy="300" r="2" fill="#1a3309"/>
                    <circle cx="500" cy="300" r="2" fill="#1a3309"/>
                    <circle cx="515" cy="300" r="2" fill="#1a3309"/>
                    <circle cx="530" cy="300" r="2" fill="#1a3309"/>
                    <circle cx="470" cy="315" r="2" fill="#1a3309"/>
                    <circle cx="485" cy="315" r="2" fill="#1a3309"/>
                    <circle cx="500" cy="315" r="2" fill="#1a3309"/>
                    <circle cx="515" cy="315" r="2" fill="#1a3309"/>
                    <circle cx="530" cy="315" r="2" fill="#1a3309"/>
                    <circle cx="470" cy="330" r="2" fill="#1a3309"/>
                    <circle cx="485" cy="330" r="2" fill="#1a3309"/>
                    <circle cx="500" cy="330" r="2" fill="#1a3309"/>
                    <circle cx="515" cy="330" r="2" fill="#1a3309"/>
                    <circle cx="530" cy="330" r="2" fill="#1a3309"/>
                    
                    <text x="500" y="370" text-anchor="middle" fill="white" font-size="14" font-family="Arial">U1</text>
                    
                    <!-- Secondary ICs -->
                    <rect x="200" y="200" width="80" height="80" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="2" class="component" 
                          data-component="secondary-ic" data-info="Secondary IC - Power management or peripheral controller" 
                          data-tests="Voltage regulation test, current draw measurement, thermal monitoring"/>
                    <rect x="205" y="205" width="70" height="70" fill="url(#goldGradient)"/>
                    <text x="240" y="290" text-anchor="middle" fill="white" font-size="12" font-family="Arial">U2</text>
                    
                    <rect x="720" y="200" width="80" height="80" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="2" class="component" 
                          data-component="secondary-ic" data-info="Secondary IC - Communication or sensor interface" 
                          data-tests="Communication protocol test, signal integrity check, sensor calibration"/>
                    <rect x="725" y="205" width="70" height="70" fill="url(#goldGradient)"/>
                    <text x="760" y="290" text-anchor="middle" fill="white" font-size="12" font-family="Arial">U3</text>
                    
                    <!-- Passive Components -->
                    <rect x="200" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="resistor" data-info="R1 - Surface mount resistor" 
                          data-tests="Resistance measurement, power rating verification, visual inspection"/>
                    <rect x="250" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="resistor" data-info="R2 - Surface mount resistor" 
                          data-tests="Resistance measurement, power rating verification, visual inspection"/>
                    <rect x="300" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="resistor" data-info="R3 - Surface mount resistor" 
                          data-tests="Resistance measurement, power rating verification, visual inspection"/>
                    <rect x="350" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="resistor" data-info="R4 - Surface mount resistor" 
                          data-tests="Resistance measurement, power rating verification, visual inspection"/>
                    
                    <rect x="400" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="capacitor" data-info="C1 - Surface mount capacitor" 
                          data-tests="Capacitance measurement, ESR test, leakage current check"/>
                    <rect x="450" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="capacitor" data-info="C2 - Surface mount capacitor" 
                          data-tests="Capacitance measurement, ESR test, leakage current check"/>
                    <rect x="500" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="capacitor" data-info="C3 - Surface mount capacitor" 
                          data-tests="Capacitance measurement, ESR test, leakage current check"/>
                    <rect x="550" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="capacitor" data-info="C4 - Surface mount capacitor" 
                          data-tests="Capacitance measurement, ESR test, leakage current check"/>
                    
                    <rect x="600" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="inductor" data-info="L1 - Surface mount inductor" 
                          data-tests="Inductance measurement, Q-factor test, DC resistance check"/>
                    <rect x="650" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="inductor" data-info="L2 - Surface mount inductor" 
                          data-tests="Inductance measurement, Q-factor test, DC resistance check"/>
                    <rect x="700" y="350" width="30" height="12" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="1" class="component" 
                          data-component="inductor" data-info="L3 - Surface mount inductor" 
                          data-tests="Inductance measurement, Q-factor test, DC resistance check"/>
                    
                    <!-- Component labels -->
                    <text x="215" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">R1</text>
                    <text x="265" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">R2</text>
                    <text x="315" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">R3</text>
                    <text x="365" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">R4</text>
                    <text x="415" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">C1</text>
                    <text x="465" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">C2</text>
                    <text x="515" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">C3</text>
                    <text x="565" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">C4</text>
                    <text x="615" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">L1</text>
                    <text x="665" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">L2</text>
                    <text x="715" y="360" text-anchor="middle" fill="white" font-size="10" font-family="Arial">L3</text>
                    
                    <!-- Connectors -->
                    <rect x="400" y="120" width="20" height="180" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="2" class="component" 
                          data-component="pin-header" data-info="18-pin vertical header connector" 
                          data-tests="Pin continuity test, mechanical fit check, signal integrity verification"/>
                    
                    <rect x="750" y="120" width="20" height="120" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="2" class="component" 
                          data-component="edge-connector" data-info="10-pin edge connector interface" 
                          data-tests="Contact resistance test, mechanical fit check, signal integrity verification"/>
                    
                    <rect x="150" y="450" width="700" height="30" fill="url(#goldGradient)" stroke="#ff8000" stroke-width="2" class="component" 
                          data-component="bottom-connector" data-info="30-pin bottom edge connector - Main I/O interface" 
                          data-tests="Pin continuity test, signal integrity check, power delivery verification"/>
                    
                    <!-- Paw Print Logo -->
                    <g transform="translate(500, 400)">
                        <ellipse cx="0" cy="0" rx="15" ry="10" fill="white" stroke="#ffd700" stroke-width="2" class="component" 
                                data-component="logo" data-info="Aeronix Paw Print Logo - Company branding" 
                                data-tests="Visual inspection, logo clarity check"/>
                        <ellipse cx="-10" cy="-15" rx="5" ry="7" fill="white" stroke="#ffd700" stroke-width="1"/>
                        <ellipse cx="0" cy="-17" rx="5" ry="7" fill="white" stroke="#ffd700" stroke-width="1"/>
                        <ellipse cx="10" cy="-15" rx="5" ry="7" fill="white" stroke="#ffd700" stroke-width="1"/>
                    </g>
                    
                    <!-- Company Logo -->
                    <g transform="translate(800, 520)">
                        <text x="0" y="0" text-anchor="middle" fill="white" font-size="16" font-family="Arial" font-weight="bold">Aeronix</text>
                        <text x="0" y="15" text-anchor="middle" fill="white" font-size="12" font-family="Arial">13</text>
                    </g>
                    
                    <!-- Traces -->
                    <path d="M 280 200 L 450 300" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
                    <path d="M 550 300 L 720 200" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
                    <path d="M 500 350 L 500 450" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
                    <path d="M 200 200 L 280 200" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
                    <path d="M 720 200 L 800 200" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
                    <path d="M 200 350 L 280 350" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
                    <path d="M 400 350 L 450 350" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
                    <path d="M 550 350 L 600 350" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
                    <path d="M 700 350 L 800 350" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
                </svg>
            </div>
            
            <div class="analysis-panel">
                <div class="analysis-title">Component Analysis</div>
                <div class="component-info">
                    <div class="component-type" id="component-name">Click a component to analyze</div>
                    <div class="component-location" id="component-info">Select any component for detailed information</div>
                </div>
                <div class="test-procedures">
                    <h4>Test Procedures</h4>
                    <ul id="test-list">
                        <li>Click on any component to see specific test procedures</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const components = document.querySelectorAll('.component');
            const componentName = document.getElementById('component-name');
            const componentInfo = document.getElementById('component-info');
            const testList = document.getElementById('test-list');
            
            components.forEach(component => {
                component.addEventListener('click', function() {
                    // Remove previous selection
                    components.forEach(c => c.classList.remove('selected'));
                    
                    // Add selection to clicked component
                    this.classList.add('selected');
                    
                    // Update analysis panel
                    const name = this.getAttribute('data-component');
                    const info = this.getAttribute('data-info');
                    const tests = this.getAttribute('data-tests');
                    
                    componentName.textContent = name.charAt(0).toUpperCase() + name.slice(1).replace('-', ' ');
                    componentInfo.textContent = info;
                    
                    // Update test procedures
                    testList.innerHTML = '';
                    tests.split(', ').forEach(test => {
                        const li = document.createElement('li');
                        li.textContent = test;
                        testList.appendChild(li);
                    });
                });
            });
        });
    </script>
</body>
</html>
