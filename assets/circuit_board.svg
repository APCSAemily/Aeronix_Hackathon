  <rect x="375" y="285" width="5" height="10" fill="#1a3309"/>
  <rect x="385" y="285" width="5" height="10" fill="#1a3309"/>
  <rect x="395" y="285" width="5" height="10" fill="#1a3309"/>
  <rect x="405" y="285" width="5" height="10" fill="#1a3309"/>
  <rect x="415" y="285" width="5" height="10" fill="#1a3309"/>
