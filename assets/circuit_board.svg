  <rect x="85" y="185" width="10" height="5" fill="#1a3309"/>
  <rect x="85" y="195" width="10" height="5" fill="#1a3309"/>
  
  <!-- Right edge connector -->
  <rect x="480" y="100" width="20" height="100" fill="#ffd700"/>
  <rect x="485" y="105" width="10" height="5" fill="#1a3309"/>
