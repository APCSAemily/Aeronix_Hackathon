<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- PCB Background -->
  <rect x="50" y="50" width="500" height="300" fill="#2d5016" stroke="#1a3309" stroke-width="2" rx="10"/>
  
  <!-- Mounting Holes -->
  <circle cx="80" cy="80" r="15" fill="#1a3309"/>
  <circle cx="520" cy="80" r="15" fill="#1a3309"/>
  <circle cx="80" cy="320" r="15" fill="#1a3309"/>
  <circle cx="520" cy="320" r="15" fill="#1a3309"/>
  
  <!-- Mounting Hole Labels -->
  <text x="80" y="105" text-anchor="middle" fill="white" font-size="10" font-family="Arial">FTM1</text>
  <text x="520" y="105" text-anchor="middle" fill="white" font-size="10" font-family="Arial">C911</text>
  <text x="80" y="340" text-anchor="middle" fill="white" font-size="10" font-family="Arial">HOLE</text>
  <text x="520" y="340" text-anchor="middle" fill="white" font-size="10" font-family="Arial">C910</text>
  
  <!-- Main IC Footprint (BGA/QFP) -->
  <rect x="250" y="150" width="100" height="100" fill="#ffd700" stroke="#ffb000" stroke-width="1"/>
  <rect x="255" y="155" width="90" height="90" fill="#ffd700"/>
  
  <!-- Smaller IC Footprints -->
  <rect x="150" y="120" width="60" height="60" fill="#ffd700" stroke="#ffb000" stroke-width="1"/>
  <rect x="390" y="120" width="60" height="60" fill="#ffd700" stroke="#ffb000" stroke-width="1"/>
  
  <!-- Pin Headers -->
