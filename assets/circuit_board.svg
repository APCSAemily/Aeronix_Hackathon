  <rect x="265" y="285" width="5" height="10" fill="#1a3309"/>
  <rect x="275" y="285" width="5" height="10" fill="#1a3309"/>
  <rect x="285" y="285" width="5" height="10" fill="#1a3309"/>
  <rect x="295" y="285" width="5" height="10" fill="#1a3309"/>
