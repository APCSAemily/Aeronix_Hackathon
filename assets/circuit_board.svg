  <!-- Component Footprints (Resistors, Capacitors) -->
  <rect x="120" y="200" width="20" height="8" fill="#ffd700"/>
  <rect x="200" y="200" width="20" height="8" fill="#ffd700"/>
  <rect x="380" y="200" width="20" height="8" fill="#ffd700"/>
  <rect x="460" y="200" width="20" height="8" fill="#ffd700"/>
  
  <!-- Traces -->
  <path d="M 150 150 L 250 200" stroke="#ffd700" stroke-width="2" fill="none"/>
  <path d="M 350 200 L 390 150" stroke="#ffd700" stroke-width="2" fill="none"/>
  <path d="M 300 250 L 300 280" stroke="#ffd700" stroke-width="2" fill="none"/>
  
  <!-- Paw Print Logo -->
  <g transform="translate(300, 270)">
    <!-- Paw pad -->
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="white"/>
    <!-- Toe pads -->
    <ellipse cx="-6" cy="-8" rx="3" ry="4" fill="white"/>
    <ellipse cx="0" cy="-10" rx="3" ry="4" fill="white"/>
    <ellipse cx="6" cy="-8" rx="3" ry="4" fill="white"/>
  </g>
  
  <!-- Component Labels -->
  <text x="130" y="210" text-anchor="middle" fill="white" font-size="8" font-family="Arial">R1</text>
  <text x="210" y="210" text-anchor="middle" fill="white" font-size="8" font-family="Arial">C1</text>
  <text x="390" y="210" text-anchor="middle" fill="white" font-size="8" font-family="Arial">L1</text>
  <text x="470" y="210" text-anchor="middle" fill="white" font-size="8" font-family="Arial">U1</text>
  
  <!-- Company Logo (ST) -->
